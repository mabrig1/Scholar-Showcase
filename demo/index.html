<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholar evidence graph</title><style>body{font:16px system-ui;background:#101827;color:#edf4ff;max-width:760px;margin:40px auto;padding:20px}button,input,select{font:inherit;padding:8px;margin:4px}svg{width:100%;background:#172438;border-radius:12px}text{fill:#edf4ff;font-size:13px}li{padding:5px}</style><h1>Evidence Atlas — synthetic graph</h1><p>Fictional evidence only. Relationships are user-entered, not scientific verification.</p><form id="form"><label>Source label <input id="source" required maxlength="24"></label><label>Relation <select id="relation"><option>supports</option><option>contradicts</option><option>uncertain</option></select></label><button>Add evidence</button></form><svg id="graph" viewBox="0 0 600 320" role="img" aria-label="Synthetic evidence graph"><circle cx="300" cy="160" r="34" fill="#365886"/><text x="300" y="164" text-anchor="middle">Claim</text></svg><ul id="list" aria-live="polite"></ul><p>Human review required. Link counts are not proof.</p><script>const f=document.querySelector('#form'),s=document.querySelector('#source'),r=document.querySelector('#relation'),g=document.querySelector('#graph'),l=document.querySelector('#list');const ns='http://www.w3.org/2000/svg';let items=[];function node(tag,attrs,txt){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt)e.textContent=txt;return e}f.onsubmit=e=>{e.preventDefault();if(items.length>=8||!s.value.trim())return;items.push({name:s.value.trim(),rel:r.value});s.value='';g.querySelectorAll('.evidence').forEach(x=>x.remove());items.forEach((a,i)=>{const angle=2*Math.PI*i/items.length,x=300+210*Math.cos(angle),y=160+115*Math.sin(angle),color={supports:'#65d6a1',contradicts:'#f78c90',uncertain:'#e9bf68'}[a.rel];g.prepend(node('line',{class:'evidence',x1:300,y1:160,x2:x,y2:y,stroke:color,'stroke-width':2}));g.append(node('circle',{class:'evidence',cx:x,cy:y,r:12,fill:color}));g.append(node('text',{class:'evidence',x,y:y-18,'text-anchor':'middle'},a.name))});const li=document.createElement('li');li.textContent=items.at(-1).name+': '+items.at(-1).rel;l.append(li);if(items.length===8)f.querySelector('button').disabled=true};</script></html>
